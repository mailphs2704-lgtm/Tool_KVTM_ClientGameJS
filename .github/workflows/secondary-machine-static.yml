name: Secondary machine checks

on:
  push:
    branches:
      - feature/secondary-machine-migration
      - develop/multi-auto-dev
    paths:
      - 'tools/KVTM_PROFILE_TRANSFER.ps1'
      - 'tools/KVTM_PROFILE_VERIFY.ps1'
      - 'tools/KVTM_MACHINE_SETUP.ps1'
      - 'tools/KVTM_GITHUB_BRIDGE.ps1'
      - 'tools/KVTM_RUNTIME_UPDATE.ps1'
      - 'source-archive/multi-current/kvtm_multi_tool/runtime_update_ui.py'
      - 'source-archive/multi-current/kvtm_multi_tool/kvtm_multi_dev_host.py'
      - 'KVTM_SECONDARY_BOOTSTRAP.ps1'
      - 'KVTM_MACHINE_TRANSFER_CONTROL.bat'
      - 'packaging/suite-v0.15/BUILD_FULL_PACKAGE_PS51.ps1'
      - '.gitignore'
      - '.github/workflows/secondary-machine-static.yml'
  workflow_dispatch:

jobs:
  powershell-static:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse migration PowerShell
        shell: powershell
        run: |
          $files = @(
            '.\tools\KVTM_PROFILE_TRANSFER.ps1',
            '.\tools\KVTM_PROFILE_VERIFY.ps1',
            '.\tools\KVTM_MACHINE_SETUP.ps1',
            '.\tools\KVTM_GITHUB_BRIDGE.ps1',
            '.\tools\KVTM_RUNTIME_UPDATE.ps1',
            '.\KVTM_SECONDARY_BOOTSTRAP.ps1',
            '.\packaging\suite-v0.15\BUILD_FULL_PACKAGE_PS51.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PARSE FAIL: $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            } else {
              Write-Host "PARSE OK: $file" -ForegroundColor Green
            }
          }
          if ($failed) { throw 'PowerShell parse check failed' }

      - name: Parse runtime updater Python
        shell: powershell
        run: |
          python -m py_compile .\source-archive\multi-current\kvtm_multi_tool\runtime_update_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'runtime_update_ui.py compile failed' }
          python -m py_compile .\source-archive\multi-current\kvtm_multi_tool\kvtm_multi_dev_host.py
          if ($LASTEXITCODE -ne 0) { throw 'kvtm_multi_dev_host.py compile failed' }
          Write-Host 'RUNTIME_UPDATE_PYTHON_PARSE_OK' -ForegroundColor Green

      - name: Regression test PowerShell 5.1 JSON arrays
        shell: powershell
        run: |
          $json = '[{"id":"1"},{"id":"2"},{"id":"3"}]'
          [object[]]$items = ($json | ConvertFrom-Json)
          if ($items.Count -ne 3) {
            throw "Top-level JSON array count regression: expected 3, got $($items.Count)"
          }
          if ([string]$items[1].id -ne '2') {
            throw 'Top-level JSON array item access regression'
          }
          Write-Host 'POWERSHELL_JSON_ARRAY_REGRESSION_OK' -ForegroundColor Green

      - name: Regression test PowerShell 5.1 native Git HEAD capture
        shell: powershell
        run: |
          $gitCommand = Get-Command git.exe -CommandType Application | Select-Object -First 1
          [string]$nativeGit = $gitCommand.Source
          if ([string]::IsNullOrWhiteSpace($nativeGit)) { throw 'git.exe missing on runner' }
          [object[]]$headOutput = @(& $nativeGit -C $PWD rev-parse HEAD 2>$null)
          $rc = $LASTEXITCODE
          [string]$head = ($headOutput | Select-Object -First 1)
          if ($rc -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            throw "Native Git HEAD capture failed rc=$rc"
          }
          Write-Host "POWERSHELL_NATIVE_GIT_HEAD_OK $head" -ForegroundColor Green

      - name: Smoke test PS5.1 package HEAD patch target
        shell: powershell
        run: |
          $builder = '.\packaging\suite-v0.15\BUILD_FULL_PACKAGE.ps1'
          $source = Get-Content -LiteralPath $builder -Raw -Encoding UTF8
          $oldBlock = @'
          $head = (& git -C $RepoRoot rev-parse HEAD 2>$null | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
              throw "Cannot determine repository HEAD for package stamp."
          }
          '@
          if (-not $source.Contains($oldBlock)) {
            throw 'PS5.1 package HEAD patch target not found'
          }
          $newBlock = @'
          [object[]]$headOutput = @(& $env:KVTM_PS51_GIT_EXE -C $RepoRoot rev-parse HEAD 2>$null)
          $headExit = $LASTEXITCODE
          $head = [string]($headOutput | Select-Object -First 1)
          if ($headExit -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
              throw "Cannot determine repository HEAD for package stamp. exit=$headExit"
          }
          '@
          $patched = $source.Replace($oldBlock, $newBlock)
          if ($patched -eq $source -or -not $patched.Contains('$headExit = $LASTEXITCODE')) {
            throw 'PS5.1 package HEAD replacement failed'
          }
          Write-Host 'PS51_PACKAGE_HEAD_PATCH_TARGET_OK' -ForegroundColor Green

      - name: Static safety check GitHub bridge
        shell: powershell
        run: |
          $bridge = Get-Content '.\tools\KVTM_GITHUB_BRIDGE.ps1' -Raw -Encoding UTF8
          foreach ($required in @(
            'SAFE_DIAGNOSTIC_ONLY',
            'profile_data_uploaded=false',
            'transfer_file_uploaded=false',
            "'.kvtm'",
            "'profiles.json'",
            'data-machine-sync',
            'machine-sync/cry-pc'
          )) {
            if (-not $bridge.Contains($required)) {
              throw "GitHub bridge safety marker missing: $required"
            }
          }
          if (-not $bridge.Contains("Get-SafeDiagnosticText")) {
            throw 'GitHub bridge safe diagnostic filter missing'
          }
          Write-Host 'GITHUB_BRIDGE_STATIC_SAFETY_OK' -ForegroundColor Green

      - name: Static safety check staged runtime updater
        shell: powershell
        run: |
          $updater = Get-Content '.\tools\KVTM_RUNTIME_UPDATE.ps1' -Raw -Encoding UTF8
          foreach ($required in @(
            'pending_restart',
            'ActivatePending',
            'Test-RuntimeBusy',
            'Sync-CurrentDataToStage',
            '.source-head.txt',
            'pull --ff-only',
            '.previous'
          )) {
            if (-not $updater.Contains($required)) {
              throw "Runtime updater safety marker missing: $required"
            }
          }
          if ($updater.Contains('Remove-Item -LiteralPath $RuntimePath -Recurse -Force')) {
            throw 'Runtime updater must never delete active runtime directly'
          }
          Write-Host 'RUNTIME_UPDATE_STAGING_SAFETY_OK' -ForegroundColor Green

      - name: Smoke test transfer collections and crypto primitives
        shell: powershell
        run: |
          [object[]]$profiles = @()
          1..13 | ForEach-Object {
            $profiles += [pscustomobject]@{ id = [string]$_; secret_args = [object[]]@('a','b','c') }
          }
          if ($profiles.Count -ne 13) { throw 'object[] accumulation failed' }
          $payload = [pscustomobject]@{ profile_count = $profiles.Count; profiles = [object[]]$profiles }
          $json = ConvertTo-Json -InputObject $payload -Depth 10 -Compress
          $parsed = $json | ConvertFrom-Json
          [object[]]$parsedProfiles = $parsed.profiles
          if ($parsedProfiles.Count -ne 13) { throw 'object[] JSON round-trip failed' }

          $salt = New-Object byte[] 32
          $kdf = New-Object Security.Cryptography.Rfc2898DeriveBytes('0123456789abcdef', $salt, 100000)
          try { $material = $kdf.GetBytes(64) } finally { $kdf.Dispose() }
          if ($material.Length -ne 64) { throw 'PBKDF2 smoke failed' }

          $key = New-Object byte[] 32
          [Array]::Copy($material, 0, $key, 0, 32)
          $hmac = New-Object Security.Cryptography.HMACSHA256 -ArgumentList (,$key)
          try { $mac = $hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes('kvtm-smoke')) } finally { $hmac.Dispose() }
          if ($mac.Length -ne 32) { throw 'HMAC smoke failed' }
          Write-Host 'TRANSFER_COLLECTION_CRYPTO_SMOKE_OK' -ForegroundColor Green

      - name: Run read-only machine diagnostic
        shell: powershell
        run: |
          & .\tools\KVTM_MACHINE_SETUP.ps1
          $latest = Get-Content .\data-machine-diagnostic\LATEST.txt -Raw
          if (-not (Test-Path -LiteralPath $latest.Trim() -PathType Leaf)) {
            throw 'Machine diagnostic did not produce its report'
          }
          Write-Host 'MACHINE_DIAGNOSTIC_EXECUTION_OK' -ForegroundColor Green

      - name: Ensure transfer artifacts are ignored
        shell: powershell
        run: |
          foreach ($pattern in @('^\*\.kvtm$', '^data-machine-sync/$')) {
            if (-not (Select-String -Path .\.gitignore -Pattern $pattern -Quiet)) {
              throw "Required ignore missing: $pattern"
            }
          }
          Write-Host 'TRANSFER_ARTIFACT_IGNORE_OK' -ForegroundColor Green
