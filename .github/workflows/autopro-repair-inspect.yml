name: AUTO PRO repair reference inspect

on:
  push:
    branches:
      - develop/multi-auto-dev
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect archived AUTO PRO repair bytecode
        run: python tools/inspect_autopro_machine_repair_reference.py
