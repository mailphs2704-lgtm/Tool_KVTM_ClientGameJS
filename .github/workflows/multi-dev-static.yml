name: Multi DEV checks

on:
  push:
    branches:
      - develop/multi-auto-dev
  workflow_dispatch:

jobs:
  clear-stall-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            components/clientjs-auto \
            source-archive/multi-current/kvtm_multi_tool

      - name: Verify clear-stall manifest rules
        run: |
          python - <<'PY'
          import sys
          import tempfile
          import threading
          from pathlib import Path

          sys.path.insert(0, str(Path('components/clientjs-auto/workflows').resolve()))
          from clear_stall.manifest import (
              ItemFingerprint,
              PurchasedItem,
              TransactionManifest,
          )
          from clear_stall.detector import PageScan, StallScanner
          from clear_stall.workflow import ClearStallRequest, ClearStallWorkflow

          def fp(char: str):
              value = (char * 64)[:64]
              phash = (char * 16)[:16]
              return ItemFingerprint(value, phash, 84, 84, '')

          def add_units(manifest, fingerprint, count):
              start = len(manifest.items)
              for index in range(count):
                  manifest.items.append(PurchasedItem(
                      fingerprint=fingerprint,
                      source_page=1,
                      source_slot=((start + index) % 8) + 1,
                      requested_quantity=1,
                      purchased_quantity=1,
                  ))

          def manifest_for(*groups, profile='profile-A'):
              manifest = TransactionManifest(profile, 2, 2, 999)
              for fingerprint, count in groups:
                  add_units(manifest, fingerprint, count)
              return manifest

          a = fp('a')
          b = fp('b')

          m = manifest_for((a, 7))
          assert m.sellable_total == 0
          assert m.planned_remainder_total == 7
          assert len(m.resale_batches()) == 0

          m = manifest_for((a, 10))
          assert m.sellable_total == 10
          assert len(m.resale_batches()) == 1
          m.record_group_sale(a, 10)
          m.complete()
          assert m.retained_total == 0

          m = manifest_for((a, 13))
          assert m.sellable_total == 10
          assert m.planned_remainder_total == 3
          m.record_group_sale(a, 10)
          m.complete()
          assert m.retained_total == 3

          m = manifest_for((a, 20))
          assert m.sellable_total == 20
          assert len(m.resale_batches()) == 2

          # Different VP types must never be combined into one ten-unit batch.
          m = manifest_for((a, 6), (b, 4))
          assert m.purchased_total == 10
          assert m.sellable_total == 0
          assert len(m.resale_batches()) == 0

          m = manifest_for((a, 10), (b, 9))
          assert m.sellable_total == 10
          assert m.planned_remainder_total == 9

          # Carryover 3 + a later 7 of the same VP must become one batch of 10.
          m = manifest_for((a, 3), (a, 7))
          assert m.sellable_total == 10
          assert len(m.resale_batches()) == 1

          prev = PageScan(1, (), tuple('abcdefgh'), 'p1')
          cur1 = PageScan(2, (), tuple('bcdefghi'), 'p2')
          cur2 = PageScan(2, (), tuple('cdefghij'), 'p3')
          same = PageScan(2, (), tuple('abcdefgh'), 'p4')
          assert StallScanner.infer_forward_shift(prev, cur1) == 1
          assert StallScanner.infer_forward_shift(prev, cur2) == 2
          assert StallScanner.infer_forward_shift(prev, same) == 0

          # Persist carryover outside each run folder, reload it on the next run,
          # and prove one profile can never consume another profile's remainder.
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)

              def workflow(profile, run_name):
                  request = ClearStallRequest(
                      profile_id=profile,
                      friend_ordinal=2,
                      stall_id=2,
                      buy_quantity=8,
                      max_scan_pages=20,
                      work_dir=root / profile / run_name,
                  )
                  return ClearStallWorkflow(
                      request,
                      adapter=None,
                      stop_event=threading.Event(),
                      logger=lambda _message: None,
                  )

              first = workflow('profile-A', 'run-1')
              first.manifest.items = manifest_for((a, 13)).items
              first.manifest.record_group_sale(a, 10)
              first._save_carryover()
              assert first.carryover_path.is_file()

              second = workflow('profile-A', 'run-2')
              assert second.manifest.purchased_total == 3
              add_units(second.manifest, a, 7)
              assert second.manifest.sellable_total == 10
              second.manifest.record_group_sale(a, 10)
              second.manifest.complete()
              second._save_carryover()
              assert not second.carryover_path.exists()

              other = workflow('profile-B', 'run-1')
              assert other.manifest.purchased_total == 0

          print('CLEAR_STALL_STATIC_OK')
          PY

  package-smoke:
    needs: clear-stall-static
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Build fixed-layout package
        shell: powershell
        run: |
          & .\packaging\suite-v0.15\BUILD_FULL_PACKAGE.ps1 -OutputName "KVTM-ClientJS-Suite-CI"

      - name: Verify package contents and privacy
        shell: powershell
        run: |
          $root = Join-Path $PWD "dist\KVTM-ClientJS-Suite-CI"
          $zip = "$root.zip"
          $required = @(
            (Join-Path $root "Multi\kvtm_multi.py"),
            (Join-Path $root "Multi\kvtm_multi_entry.py"),
            (Join-Path $root "components\clientjs-auto\worker\auto_worker.py"),
            (Join-Path $root "components\clientjs-auto\worker\clear_stall_worker.py"),
            (Join-Path $root "components\clientjs-auto\workflows\clear_stall\manifest.py"),
            (Join-Path $root "components\clientjs-auto\workflows\clear_stall\workflow.py"),
            (Join-Path $root "02_START_MULTI_DEV.bat"),
            $zip
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Missing package item: $item"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $bad = @($archive.Entries | Where-Object {
              $_.FullName -match '(^|/)(data-dev|auto-logs|clear-stall)(/|$)' -or
              $_.FullName -match '(^|/)(profiles|settings)\.json$'
            })
            if ($bad.Count -gt 0) {
              throw "Private/runtime data leaked into ZIP: $($bad.FullName -join ', ')"
            }
          }
          finally {
            $archive.Dispose()
          }

          Write-Host "PACKAGE_SMOKE_OK" -ForegroundColor Green

      - name: Preflight packaged Auto Pro runtime
        shell: powershell
        run: |
          @'
          import importlib
          import sys
          from pathlib import Path

          root = Path('dist/KVTM-ClientJS-Suite-CI').resolve()
          auto_root = root / 'AUTO_PRO'
          worker_root = root / 'components' / 'clientjs-auto' / 'worker'
          sys.path.insert(0, str(worker_root))

          from auto_worker import install_headless_clientjs_runtime

          automation = install_headless_clientjs_runtime(auto_root)
          adb_controller = importlib.import_module('adb_controller')
          cv2 = importlib.import_module('cv2')
          numpy = importlib.import_module('numpy')

          assert hasattr(automation, 'FarmAutomation')
          assert hasattr(adb_controller, 'ADBController')
          assert callable(getattr(automation.FarmAutomation, 'start', None))
          assert getattr(cv2, '__version__', None)
          assert getattr(numpy, '__version__', None)

          print('PACKAGED_RUNTIME_PREFLIGHT_OK')
          print('cv2=' + str(cv2.__version__))
          print('numpy=' + str(numpy.__version__))
          '@ | Set-Content -LiteralPath .\runtime_preflight_ci.py -Encoding UTF8
          python .\runtime_preflight_ci.py
          Remove-Item -LiteralPath .\runtime_preflight_ci.py -Force
