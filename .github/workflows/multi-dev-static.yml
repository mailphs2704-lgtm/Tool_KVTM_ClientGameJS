name: Multi DEV checks

on:
  push:
    branches:
      - develop/multi-auto-dev
  workflow_dispatch:

jobs:
  clear-stall-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            components/clientjs-auto \
            source-archive/multi-current/kvtm_multi_tool

      - name: Verify clean architecture and business rules
        run: |
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          component = Path('components/clientjs-auto').resolve()
          sys.path.insert(0, str(component))

          from kvtm_automation.actions.stall import StallActions
          from kvtm_automation.models import VisualFingerprint
          from kvtm_automation.workflows.clear_stall.config import ClearStallRequest
          from kvtm_automation.workflows.clear_stall.manifest import (
              ClearStallManifest,
              PurchasedRecord,
          )
          from kvtm_automation.workflows.clear_stall.state import CarryoverStore

          def fp(ch):
              return VisualFingerprint(ch * 64, ch * 16, 84, 84, '')

          def record(fingerprint, count, slot=1):
              return PurchasedRecord(
                  fingerprint=fingerprint,
                  source_view=1,
                  source_local_slot=slot,
                  source_physical_slot=slot,
                  purchased_quantity=count,
              )

          a = fp('a')
          b = fp('b')

          physical = []
          for view in range(1, 5):
              for local in StallActions.new_local_slots(view):
                  physical.append(StallActions.physical_slot(view, local))
          assert physical == list(range(1, 21)), physical

          m = ClearStallManifest('A', 2, 2, 7)
          m.records = [record(a, 7)]
          assert m.sellable_remaining_total == 0
          assert m.planned_remainder_total == 7
          assert not m.resale_batches()

          m = ClearStallManifest('A', 2, 2, 10)
          m.records = [record(a, 10)]
          assert len(m.resale_batches()) == 1
          m.record_group_sale(a, 10)
          assert m.remaining_total == 0

          m = ClearStallManifest('A', 2, 2, 13)
          m.records = [record(a, 13)]
          assert len(m.resale_batches()) == 1
          assert m.planned_remainder_total == 3
          m.record_group_sale(a, 10)
          assert m.remaining_total == 3

          m = ClearStallManifest('A', 2, 2, 20)
          m.records = [record(a, 20)]
          assert len(m.resale_batches()) == 2

          mixed = ClearStallManifest('A', 2, 2, 10)
          mixed.records = [record(a, 6), record(b, 4, 2)]
          assert mixed.remaining_total == 10
          assert mixed.sellable_remaining_total == 0
          assert not mixed.resale_batches()

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              store_a = CarryoverStore(root / 'profile-A')
              first = ClearStallManifest('profile-A', 2, 2, 13)
              first.records = [record(a, 13)]
              first.record_group_sale(a, 10)
              store_a.save(first)
              loaded = store_a.load('profile-A')
              assert sum(item.remaining_quantity for item in loaded) == 3

              second = ClearStallManifest('profile-A', 2, 2, 7)
              for item in loaded:
                  second.add_carryover(item)
              second.records.append(record(a, 7, 2))
              assert second.remaining_total == 10
              assert len(second.resale_batches()) == 1
              second.record_group_sale(a, 10)
              store_a.save(second)
              assert not store_a.path.exists()

              store_b = CarryoverStore(root / 'profile-B')
              assert store_b.load('profile-B') == []

          request = ClearStallRequest('A', 7, 5, 8, Path('.'))
          assert request.friend_ordinal == 7
          assert request.resale_storage_id == 5
          try:
              ClearStallRequest('A', 8, 2, 8, Path('.'))
          except ValueError:
              pass
          else:
              raise AssertionError('friend ordinal 8 must remain blocked until paging is verified')

          workers = [
              component / 'worker' / 'clear_stall_worker.py',
              component / 'worker' / 'clear_stall_live_probe.py',
          ]
          forbidden = (
              'from auto_worker import',
              'import auto_worker',
              'FarmAutomation',
              'ADBController',
              'install_headless_clientjs_runtime',
              'automation.pyc',
              'adb_controller.pyc',
              'runtime/pyc',
          )
          for worker in workers:
              source = worker.read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in source, (worker, token)

          probe_source = workers[1].read_text(encoding='utf-8')
          for token in (
              'automation.buying',
              'automation.selling',
              'sell_batch_of_ten(',
              'buy_from_listing(',
          ):
              assert token not in probe_source, token

          required_clean = (
              'automation.py',
              'context.py',
              'models.py',
              'runtime/bootstrap.py',
              'runtime/driver.py',
              'runtime/vision.py',
              'actions/popup.py',
              'actions/navigation.py',
              'actions/stall.py',
              'actions/buying.py',
              'actions/inventory.py',
              'actions/selling.py',
              'workflows/clear_stall/config.py',
              'workflows/clear_stall/manifest.py',
              'workflows/clear_stall/state.py',
              'workflows/clear_stall/result.py',
              'workflows/clear_stall/workflow.py',
          )
          clean_root = component / 'kvtm_automation'
          for relative in required_clean:
              assert (clean_root / relative).is_file(), relative

          print('CLEAR_STALL_CLEAN_ARCHITECTURE_OK')
          print('CLEAR_STALL_20_SLOT_MAPPING_OK')
          print('CLEAR_STALL_BATCH_AND_CARRYOVER_OK')
          print('CLEAR_STALL_WORKERS_NO_PYC_DEPENDENCY_OK')
          print('CLEAR_STALL_LIVE_PROBE_READ_ONLY_OK')
          PY


      - name: Verify Bridge V3 production adapter contract
        run: |
          python -m py_compile \
            bridge-v3/python/kvtm_bridge_v3.py \
            bridge-v3/tools/verify_v3.py \
            bridge-v3/tools/probe_v3.py \
            components/clientjs-auto/worker/bridge_v3_gesture_probe.py \
            components/clientjs-auto/worker/speed_binding_probe.py \
            test-candidates/auto-pro-clientjs-temp/pc_driver.py \
            test-candidates/auto-pro-clientjs-temp/engine_driver.py
          python - <<'PY'
          from pathlib import Path

          engine = Path('test-candidates/auto-pro-clientjs-temp/engine_driver.py').read_text(encoding='utf-8')
          native_v3 = Path('bridge-v3/native/kvtm_bridge_v3.cpp').read_text(encoding='utf-8')
          pc = Path('test-candidates/auto-pro-clientjs-temp/pc_driver.py').read_text(encoding='utf-8')
          builder = Path('packaging/suite-v0.15/BUILD_FULL_PACKAGE.ps1').read_text(encoding='utf-8')
          worker = Path('components/clientjs-auto/worker/auto_worker.py').read_text(encoding='utf-8')
          multi = Path('source-archive/multi-current/kvtm_multi_tool/kvtm_multi.py').read_text(encoding='utf-8')
          clientjs_patch = Path('test-candidates/auto-pro-clientjs-temp/clientjs_auto_patch.py').read_text(encoding='utf-8')

          required_engine = (
              'KVTM-CocosV3-', 'KVTM-CaptureV3-', 'version != 3',
              'pixel_format != 2', 'time.perf_counter',
              'fallback="disabled"', 'kvtm_bridge_v3.dll', 'return timing',
              'segment_steps = max(1, min(400, int(configured_duration / 0.005)))',
              'pipe_mode="single_batch"', 'configured_seconds_per_segment',
              'SWIPE {segment_steps}', 'CreateFileW',
              'caller_name = sys._getframe(1).f_code.co_name', 'gesture_observer',
          )
          for token in required_engine:
              assert token in engine, token
          for token in (
              'duration * (len(path) - 1)',
              'shared_capture_fallback',
              'KVTM-Cocos-{self.pid}',
              'KVTM-Capture-{self.pid}',
              'math.hypot(dx, dy) / 8.0',
              'interpolation_px=64',
              'math.ceil(math.hypot',
              'pipe_mode="persistent"',
              'replay_path =',
          ):
              assert token not in engine, token
          for token in ('time.sleep(0.018)', 'time.sleep(0.014)', 'time.sleep(0.025)'):
              assert token not in pc, token
          for token in (
              'Keep one connection alive', 'for (;;)',
              'INPUT4 BATCH_SWIPE', 'parse_gesture',
              'dispatch_gesture', 'segment_steps', 'step_ticks',
          ):
              assert token in native_v3, token
          for token in ('Build-KvtmBridgeV3', 'kvtm_bridge_v3.dll', 'kvtm_loader_v3.exe'):
              assert token in builder, token
          for token in (
              'setattr(automation, key, value)', 'setattr(controller, key, value)',
              'synchronized_targets', 'gesture_timing',
              '"Kho 1": 1', '"Kho 2": 2', '"Max Kho": 3',
              '"Kho 1 & 2": 4', '"time_nang_kho": auto_nang_kho_time_hours',
              '"balance_nang_kho": auto_nang_kho_balance',
              'controller.open_chests_enabled = bool(auto_options["open_chest"])',
              'def install_clientjs_runtime(auto_root: Path, profile_id: str):',
              'return EngineDriver(str(profile_id), reference_size=(1000, 1000))',
              'install_clientjs_runtime(auto_root, args.profile_id)',
          ):
              assert token in worker, token
          for token in (
              'rows = running_clients()',
              'lambda snapshot=rows: self._adopt_running_clients(snapshot)',
              'Injection remains restricted',
          ):
              assert token in multi, token
          for token in (
              'for x, y in ((500, 660), (433, 557))',
              'for attempt in range(5)',
              'attempt=attempt + 1',
              'before = after',
          ):
              assert token in clientjs_patch, token
          print('BRIDGE_V3_PRODUCTION_ADAPTER_STATIC_OK')
          print('BRIDGE_V3_AUTO_PRO_BATCH_SEMANTICS_OK')
          print('BRIDGE_V3_STRICT_CAPTURE_NO_FALLBACK_OK')
          PY

  package-smoke:
    needs: clear-stall-static
    runs-on: windows-latest
    steps:
      - name: Checkout runtime with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Build fixed-layout package
        shell: powershell
        run: |
          & .\packaging\suite-v0.15\BUILD_FULL_PACKAGE_PS51.ps1 -OutputName "KVTM-ClientJS-Suite-CI"

      - name: Verify runtime data survives fixed DEV rebuild
        shell: powershell
        run: |
          $root = Join-Path $PWD "dist\KVTM-ClientJS-Suite-CI"
          $stateMarker = Join-Path $root "data-dev\clear-stall\profile-ci\state\carryover-marker.txt"
          $probeMarker = Join-Path $root "data-dev\clear-stall-probe\profile-ci\probe-marker.txt"
          New-Item -ItemType Directory -Path (Split-Path $stateMarker) -Force | Out-Null
          New-Item -ItemType Directory -Path (Split-Path $probeMarker) -Force | Out-Null
          Set-Content -LiteralPath $stateMarker -Value "KEEP-CLEAR-STALL" -Encoding ASCII
          Set-Content -LiteralPath $probeMarker -Value "KEEP-LIVE-PROBE" -Encoding ASCII

          & .\packaging\suite-v0.15\BUILD_FULL_PACKAGE_PS51.ps1 -OutputName "KVTM-ClientJS-Suite-CI"

          if (-not (Test-Path -LiteralPath $stateMarker -PathType Leaf)) {
            throw "clear-stall state was lost during fixed DEV rebuild"
          }
          if ((Get-Content -LiteralPath $stateMarker -Raw).Trim() -ne "KEEP-CLEAR-STALL") {
            throw "clear-stall state marker changed during rebuild"
          }
          if (-not (Test-Path -LiteralPath $probeMarker -PathType Leaf)) {
            throw "clear-stall probe diagnostics were lost during fixed DEV rebuild"
          }
          if ((Get-Content -LiteralPath $probeMarker -Raw).Trim() -ne "KEEP-LIVE-PROBE") {
            throw "clear-stall probe marker changed during rebuild"
          }
          Write-Host "CLEAR_STALL_REBUILD_PRESERVE_OK" -ForegroundColor Green
          Write-Host "CLEAR_STALL_PROBE_REBUILD_PRESERVE_OK" -ForegroundColor Green

      - name: Verify package contents and privacy
        shell: powershell
        run: |
          $root = Join-Path $PWD "dist\KVTM-ClientJS-Suite-CI"
          $clean = Join-Path $root "components\clientjs-auto\kvtm_automation"
          $zip = "$root.zip"
          $required = @(
            (Join-Path $root "Multi\kvtm_multi.py"),
            (Join-Path $root "Multi\kvtm_multi_entry.py"),
            (Join-Path $root "Multi\kvtm_multi_dev_host.py"),
            (Join-Path $root "Multi\runtime_update_ui.py"),
            (Join-Path $root "components\clientjs-auto\worker\clean_worker_support.py"),
            (Join-Path $root "components\clientjs-auto\worker\clear_stall_worker.py"),
            (Join-Path $root "components\clientjs-auto\worker\clear_stall_live_probe.py"),
            (Join-Path $clean "automation.py"),
            (Join-Path $clean "runtime\bootstrap.py"),
            (Join-Path $clean "runtime\driver.py"),
            (Join-Path $clean "actions\navigation.py"),
            (Join-Path $clean "actions\stall.py"),
            (Join-Path $clean "workflows\clear_stall\manifest.py"),
            (Join-Path $clean "workflows\clear_stall\state.py"),
            (Join-Path $clean "workflows\clear_stall\workflow.py"),
            (Join-Path $root "02_START_MULTI_DEV.bat"),
            $zip
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Missing package item: $item"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $bad = @($archive.Entries | Where-Object {
              $_.FullName -match '(^|/)(data-dev|auto-logs|clear-stall|clear-stall-probe)(/|$)' -or
              $_.FullName -match '(^|/)(profiles|settings)\.json$'
            })
            if ($bad.Count -gt 0) {
              throw "Private/runtime data leaked into ZIP: $($bad.FullName -join ', ')"
            }
          }
          finally {
            $archive.Dispose()
          }
          Write-Host "PACKAGE_SMOKE_OK" -ForegroundColor Green

      - name: Preflight packaged clean Dọn quầy runtime
        shell: powershell
        run: |
          @'
          import importlib
          import sys
          from pathlib import Path

          root = Path('dist/KVTM-ClientJS-Suite-CI').resolve()
          component = root / 'components' / 'clientjs-auto'
          auto_root = root / 'AUTO_PRO'
          sys.path.insert(0, str(component))

          from kvtm_automation.runtime.bootstrap import install_binary_dependencies
          install_binary_dependencies(auto_root)
          cv2 = importlib.import_module('cv2')
          numpy = importlib.import_module('numpy')
          PIL = importlib.import_module('PIL')
          from kvtm_automation import KVAutomation
          from kvtm_automation.workflows.clear_stall import ClearStallWorkflow

          assert KVAutomation is not None
          assert ClearStallWorkflow is not None
          assert getattr(cv2, '__version__', None)
          assert getattr(numpy, '__version__', None)
          assert PIL is not None

          forbidden = (
              'from auto_worker import', 'import auto_worker', 'FarmAutomation',
              'ADBController', 'install_headless_clientjs_runtime',
              'automation.pyc', 'adb_controller.pyc', 'runtime/pyc',
          )
          for name in ('clear_stall_worker.py', 'clear_stall_live_probe.py'):
              source = (component / 'worker' / name).read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in source, (name, token)

          print('PACKAGED_CLEAN_CLEAR_STALL_PREFLIGHT_OK')
          print('cv2=' + str(cv2.__version__))
          print('numpy=' + str(numpy.__version__))
          '@ | Set-Content -LiteralPath .\clean_clear_stall_preflight_ci.py -Encoding UTF8
          python .\clean_clear_stall_preflight_ci.py
          Remove-Item -LiteralPath .\clean_clear_stall_preflight_ci.py -Force

      - name: Preflight legacy suite runtime for other AUTO features
        shell: powershell
        run: |
          @'
          import importlib
          import sys
          from pathlib import Path

          root = Path('dist/KVTM-ClientJS-Suite-CI').resolve()
          auto_root = root / 'AUTO_PRO'
          worker_root = root / 'components' / 'clientjs-auto' / 'worker'
          sys.path.insert(0, str(worker_root))
          from auto_worker import install_headless_clientjs_runtime
          automation = install_headless_clientjs_runtime(auto_root)
          adb_controller = importlib.import_module('adb_controller')
          assert hasattr(automation, 'FarmAutomation')
          assert hasattr(adb_controller, 'ADBController')
          print('LEGACY_SUITE_RUNTIME_PREFLIGHT_OK')
          '@ | Set-Content -LiteralPath .\legacy_suite_preflight_ci.py -Encoding UTF8
          python .\legacy_suite_preflight_ci.py
          Remove-Item -LiteralPath .\legacy_suite_preflight_ci.py -Force


  bridge-v3-static:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Build isolated Bridge V3 x86
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Auxiliary\Build\vcvarsall.bat`) do call "%%I" x86
          if not defined VSCMD_ARG_TGT_ARCH exit /b 1
          if not exist bridge-v3\bin mkdir bridge-v3\bin
          cl /nologo /std:c++17 /O2 /EHsc /MT /LD /Fe:bridge-v3\bin\kvtm_bridge_v3.dll bridge-v3\native\kvtm_bridge_v3.cpp user32.lib
          cl /nologo /std:c++17 /O2 /EHsc /MT /Fe:bridge-v3\bin\kvtm_loader_v3.exe bridge-v3\native\kvtm_loader_v3.cpp

      - name: Verify V3 scope, timing and PE architecture
        shell: cmd
        run: py -3.11 bridge-v3\tools\verify_v3.py --root bridge-v3

      - name: Prove production runtime is not modified
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "bridge-v3\ALLOW_RUNTIME_INSTALL.txt") {
            throw "Runtime install gate must not be committed"
          }
          Write-Host "BRIDGE_V3_RUNTIME_CUTOVER_LOCKED" -ForegroundColor Green
